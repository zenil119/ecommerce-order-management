services:

  postgres:

    image: postgres:16

    container_name: ecommerce_postgres

    restart: always

    environment:

      POSTGRES_USER: ${DB_USER}

      POSTGRES_PASSWORD: ${DB_PASSWORD}

      POSTGRES_DB: ${DB_NAME}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - ecommerce_network

  backend:

    build: .

    container_name: ecommerce_backend

    restart: always

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres

    networks:
      - ecommerce_network

  nginx:

    image: nginx:latest

    container_name: ecommerce_nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend

    networks:
      - ecommerce_network

volumes:

  postgres_data:

networks:

  ecommerce_network: