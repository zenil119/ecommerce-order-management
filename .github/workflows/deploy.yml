name: Docker CI/CD

on:

  push:

    branches:
      - master

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Docker Build
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:v1 .

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" |
          docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker Push
        run: docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:v1